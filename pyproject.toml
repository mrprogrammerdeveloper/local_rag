[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pymupdf",
    "sentence-transformers",
    "qdrant-client",
    "ollama",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]